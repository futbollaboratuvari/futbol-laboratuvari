name: Stage 1 Bulletin Flow

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update bulletin
        run: node scripts/update-fixtures.js

      - name: Check bulletin health
        run: node scripts/stage-1-bulletin-check.js

      - name: Build two day bulletin
        run: node scripts/two-day-bulletin-window.js

      - name: Commit bulletin outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data outputs
          if git diff --cached --quiet; then
            echo "No bulletin changes"
            exit 0
          fi
          git commit -m "Update stage 1 bulletin flow"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && node scripts/validate-json-no-conflicts.js && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Stage 1 push failed after retries"
          exit 1
