name: Update fixtures and High Value Engine

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/main-run.txt"
      - "ops/update-fixtures-trigger.txt"
      - ".github/workflows/update-fixtures.yml"

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  update-fixtures:
    runs-on: ubuntu-latest
    env:
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_KEY2: ${{ secrets.API_FOOTBALL_KEY2 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python robot dependencies
        working-directory: bu-klas-r-i-in-basit
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Repair conflict markers before data run
        run: node scripts/repair-conflict-markers.js

      - name: Update Mackolik fixture list
        continue-on-error: true
        run: node scripts/update-fixtures.js

      - name: Prepare data file
        run: node scripts/ensure-robot-raw-pool-json.js

      - name: Run Mackolik data robot
        working-directory: bu-klas-r-i-in-basit
        continue-on-error: true
        run: python src/mackolik_early_window_runner.py

      - name: Run full Python source collector
        working-directory: bu-klas-r-i-in-basit
        continue-on-error: true
        run: python src/robot.py

      - name: Import robot raw pool into site data
        continue-on-error: true
        run: node scripts/import-robot-raw-pool.js

      - name: Sync verified official Iddaa markets
        continue-on-error: true
        env:
          IDDAA_DETAIL_LIMIT: "24"
          IDDAA_DETAIL_CONCURRENCY: "4"
        run: node scripts/sync-iddaa-markets.js

      - name: Rebuild bulletin after fixture import
        run: |
          node scripts/sync-spor-toto-weekly-program.js || true
          node scripts/enrich-spor-toto-weekly-api.js || true
          node scripts/rebuild-spor-toto-bulletin.js
          node scripts/apply-spor-toto-archive-analysis.js
          node scripts/apply-spor-toto-weekly-market.js
          node scripts/two-day-bulletin-window.js
          node scripts/build-full-bulletin.js || true
          node scripts/repair-bulletin-flow.js
          node scripts/full-bulletin-output-check.js

      - name: Build derived team and match intelligence
        run: |
          node scripts/profile-lite.js
          node scripts/source-plan-lite.js
          node scripts/player-intelligence-api.js
          node scripts/team-news-auto.js
          node scripts/team-status-lite.js
          node scripts/lineup-lite.js
          node scripts/source-consensus.js
          node scripts/home-away-lite.js
          node scripts/standings-lite.js
          node scripts/league-structure-lite.js
          node scripts/league-expansion-lite.js
          node scripts/stats-memory-lite.js
          node scripts/team-style-note.js
          node scripts/pre-match-final-check.js
          node scripts/team-status-apply.js
          node scripts/band-lite.js
          node scripts/card-flow-lite.js
          node scripts/cards-user-choice.js

      - name: Test derived intelligence and pre-match rules
        run: |
          node tests/team-intelligence.test.js
          node tests/matchup-intelligence.test.js
          node tests/source-consensus.test.js
          node tests/pre-match-final-check.test.js
          node tests/source-consensus-band.test.js

      - name: Update robot learning archive
        continue-on-error: true
        run: node scripts/update-match-archive.js

      - name: Build diagnostic raw market blocks
        continue-on-error: true
        run: node scripts/raw-block-lite.js

      - name: Enforce verified market provenance
        run: |
          node tests/market-provenance.test.js
          node scripts/market-provenance-guard.js

      - name: Validate High Value Coupon Engine
        run: node -e "require('./scripts/robot-exact-scoring'); console.log('High Value Coupon Engine ready')"

      - name: Build High Value Coupon Engine report
        continue-on-error: true
        run: node scripts/update-analysis-report.js

      - name: Export live JSON for site
        run: |
          node tests/pro-coupon-eligibility.test.js
          node tests/pre-match-final-check.test.js
          node scripts/export-high-value-json.js

      - name: Apply focused market list
        continue-on-error: true
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const read = (p, f) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return f; } };
          const write = (p, v) => fs.writeFileSync(p, JSON.stringify(v, null, 2) + '\n', 'utf8');
          const focus = read('data/focused_markets.json', { focused_markets: [] }).focused_markets || [];
          const raw = read('data/ham_mac_havuzu.json', {});
          raw.engine_rules = raw.engine_rules || {};
          raw.engine_rules.focused_markets = Array.from(new Set([...(raw.engine_rules.focused_markets || []), ...focus]));
          raw.focused_market_count = raw.engine_rules.focused_markets.length;
          write('data/ham_mac_havuzu.json', raw);
          const analysis = read('data/analiz_sonuclari.json', { active_items: [], completed_items: [] });
          analysis.focused_markets = raw.engine_rules.focused_markets;
          analysis.focused_market_note = 'First half result, second half result and HT/FT markets are focus markets.';
          write('data/analiz_sonuclari.json', analysis);
          console.log('Focused markets applied:', raw.focused_market_count);
          NODE

      - name: Ensure live JSON
        run: node scripts/ensure-live-json.js

      - name: Enrich PRO robot with verified official markets
        run: |
          node tests/iddaa-data-source.test.js
          node tests/official-market-enrichment.test.js
          node scripts/enrich-robot-official-markets.js

      - name: Apply PRO market specialist gates
        run: |
          node tests/pro-goal-market-bridge.test.js
          node tests/market-specialist-gates.test.js
          node scripts/run-pro-goal-market-specialist.js

      - name: Route markets through specialist robot orchestrator
        run: |
          node tests/robot-specialist-orchestrator.test.js
          node scripts/robot-specialist-orchestrator.js

      - name: Fill user choice cards
        continue-on-error: true
        run: node scripts/cards-user-choice.js

      - name: Final football bulletin sync
        run: |
          node scripts/build-full-bulletin.js || true
          node scripts/repair-bulletin-flow.js
          node scripts/ensure-live-json.js
          node scripts/full-bulletin-output-check.js
          node scripts/update-match-archive.js || true
          node scripts/team-status-lite.js
          node scripts/lineup-lite.js
          node scripts/source-consensus.js
          node scripts/team-status-apply.js
          node scripts/band-lite.js

      - name: Resolve final scores and publish performance
        run: |
          node scripts/update-final-scores.js
          node scripts/learning-score-linker.js
          node scripts/learning-finalizer.js
          node scripts/sync-analysis-results.js
          node scripts/prediction-measurement-health-check.js

      - name: Finalize verified weekly Spor Toto before commit
        run: |
          node scripts/sync-spor-toto-weekly-program.js || true
          node scripts/build-spor-toto-archive-analysis.js
          node scripts/enrich-spor-toto-weekly-api.js || true
          node scripts/rebuild-spor-toto-bulletin.js
          node scripts/apply-spor-toto-archive-analysis.js
          node scripts/apply-spor-toto-weekly-market.js
          node scripts/finalize-spor-toto-pro.js
          node tests/spor-toto-archive.test.js
          node tests/spor-toto-market.test.js
          node tests/spor-toto-weekly.test.js
          node tests/team-intelligence.test.js
          node tests/team-intelligence-integration.test.js
          node tests/pre-match-final-check.test.js

      - name: Validate data outputs before commit
        run: |
          node scripts/validate-json-no-conflicts.js
          node scripts/validate-generated-file-sizes.js

      - name: Commit and push High Value Engine outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          node scripts/validate-json-no-conflicts.js
          node tests/spor-toto-archive.test.js
          node tests/spor-toto-market.test.js
          node tests/spor-toto-weekly.test.js
          node tests/team-intelligence.test.js
          node tests/team-intelligence-integration.test.js
          node tests/pre-match-final-check.test.js
          node scripts/validate-generated-file-sizes.js
          git add -A data outputs bu-klas-r-i-in-basit/data bu-klas-r-i-in-basit/outputs
          if git diff --cached --quiet; then
            echo "No output changes to commit"
            exit 0
          fi
          git commit -m "Update fixtures and High Value Engine"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && node scripts/validate-json-no-conflicts.js && node scripts/validate-generated-file-sizes.js && node tests/spor-toto-archive.test.js && node tests/spor-toto-market.test.js && node tests/spor-toto-weekly.test.js && node tests/team-intelligence.test.js && node tests/team-intelligence-integration.test.js && node tests/pre-match-final-check.test.js && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Update fixtures push failed after retries"
          exit 1
