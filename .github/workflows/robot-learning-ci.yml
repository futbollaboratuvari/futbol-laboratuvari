name: Robot Learning CI

on:
  pull_request:
    paths:
      - "scripts/robot-learning-memory.js"
      - "scripts/learning-*.js"
      - "scripts/apply-learning-weights.js"
      - "scripts/update-final-scores.js"
      - "tests/learning-*.test.js"
      - "tests/loss-pattern-memory.test.js"
      - "package.json"
      - ".github/workflows/robot-learning-ci.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/robot-learning-memory.js"
      - "scripts/learning-*.js"
      - "scripts/apply-learning-weights.js"
      - "scripts/update-final-scores.js"
      - "tests/learning-*.test.js"
      - "tests/loss-pattern-memory.test.js"
      - "package.json"
      - ".github/workflows/robot-learning-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  learning-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            tests
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Learning settlement regression
        run: node tests/learning-market-settlement.test.js
      - name: Learning memory retention regression
        run: node tests/learning-memory-retention.test.js
      - name: Adjacent-date dedupe regression
        run: node tests/learning-adjacent-date-dedupe.test.js
      - name: Stale learning health regression
        run: node tests/learning-health-stale.test.js
      - name: Learning confidence regression
        run: node tests/learning-confidence.test.js
      - name: Loss-pattern regression
        run: node tests/loss-pattern-memory.test.js
