name: Football Bulletin Only

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/football-bulletin-only.yml"

permissions:
  contents: write

concurrency:
  group: football-bulletin-only
  cancel-in-progress: true

jobs:
  refresh-bulletin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build fresh fixture snapshot outside repository
        shell: bash
        run: |
          set -euo pipefail
          TMP_ROOT="${RUNNER_TEMP}/fl-football-bulletin-source"
          rm -rf "$TMP_ROOT"
          mkdir -p "$TMP_ROOT/scripts" "$TMP_ROOT/data" "$TMP_ROOT/outputs"
          cp scripts/update-fixtures.js "$TMP_ROOT/scripts/update-fixtures.js"
          cp scripts/bulletin-active-filter.js "$TMP_ROOT/scripts/bulletin-active-filter.js"
          (
            cd "$TMP_ROOT"
            npm init -y >/dev/null 2>&1
            npm install playwright --no-save --no-audit --no-fund
            npx playwright install chromium
            node scripts/update-fixtures.js
          )
          node - "$TMP_ROOT/data/fixtures.json" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const rows = JSON.parse(fs.readFileSync(path, 'utf8'));
          const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Europe/Istanbul', year: 'numeric', month: '2-digit', day: '2-digit'
          }).formatToParts(new Date());
          const bag = Object.fromEntries(parts.map(x => [x.type, x.value]));
          const today = `${bag.year}-${bag.month}-${bag.day}`;
          const d = new Date(`${today}T12:00:00Z`);
          d.setUTCDate(d.getUTCDate() + 1);
          const tomorrow = d.toISOString().slice(0, 10);
          const todayCount = rows.filter(m => m.date === today).length;
          const tomorrowCount = rows.filter(m => m.date === tomorrow).length;
          console.log(`Fresh isolated source: total=${rows.length}, today=${todayCount}, tomorrow=${tomorrowCount}`);
          if (rows.length < 20) throw new Error(`Fresh source too small: ${rows.length}`);
          if (tomorrowCount < 1) throw new Error(`Fresh source has no tomorrow matches: ${tomorrow}`);
          NODE

      - name: Build only full bulletin with temporary fixture snapshot
        shell: bash
        run: |
          set -euo pipefail
          TMP_ROOT="${RUNNER_TEMP}/fl-football-bulletin-source"
          FIXTURES="data/fixtures.json"
          SPOR_TOTO="data/spor_toto_bulteni.json"
          FIX_BACKUP="${RUNNER_TEMP}/fixtures.original"
          SPOR_BACKUP="${RUNNER_TEMP}/spor_toto.original"

          if [ -f "$FIXTURES" ]; then
            cp "$FIXTURES" "$FIX_BACKUP"
            FIX_BEFORE="$(sha256sum "$FIXTURES" | awk '{print $1}')"
          else
            FIX_BEFORE="missing"
          fi
          if [ -f "$SPOR_TOTO" ]; then
            cp "$SPOR_TOTO" "$SPOR_BACKUP"
            SPOR_BEFORE="$(sha256sum "$SPOR_TOTO" | awk '{print $1}')"
          else
            SPOR_BEFORE="missing"
          fi

          cleanup() {
            if [ -f "$FIX_BACKUP" ]; then cp "$FIX_BACKUP" "$FIXTURES"; else rm -f "$FIXTURES"; fi
            if [ -f "$SPOR_BACKUP" ]; then cp "$SPOR_BACKUP" "$SPOR_TOTO"; else rm -f "$SPOR_TOTO"; fi
          }
          trap cleanup EXIT

          cp "$TMP_ROOT/data/fixtures.json" "$FIXTURES"
          rm -f "$SPOR_TOTO"
          node scripts/build-full-bulletin.js
          cleanup
          trap - EXIT

          if [ "$FIX_BEFORE" != "missing" ]; then
            FIX_AFTER="$(sha256sum "$FIXTURES" | awk '{print $1}')"
            test "$FIX_BEFORE" = "$FIX_AFTER"
          fi
          if [ "$SPOR_BEFORE" != "missing" ]; then
            SPOR_AFTER="$(sha256sum "$SPOR_TOTO" | awk '{print $1}')"
            test "$SPOR_BEFORE" = "$SPOR_AFTER"
          fi

      - name: Validate fresh today and tomorrow bulletin
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'data/full-bulletin.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const parts = new Intl.DateTimeFormat('en-CA', {
            timeZone: 'Europe/Istanbul', year: 'numeric', month: '2-digit', day: '2-digit'
          }).formatToParts(new Date());
          const bag = Object.fromEntries(parts.map(x => [x.type, x.value]));
          const today = `${bag.year}-${bag.month}-${bag.day}`;
          const d = new Date(`${today}T12:00:00Z`);
          d.setUTCDate(d.getUTCDate() + 1);
          const tomorrow = d.toISOString().slice(0, 10);
          const matches = Array.isArray(data.matches) ? data.matches : [];
          const todayCount = matches.filter(m => String(m.date || '').slice(0,10) === today).length;
          const tomorrowCount = matches.filter(m => String(m.date || '').slice(0,10) === tomorrow).length;
          if (data.status !== 'active') throw new Error(`Bulletin inactive: ${data.status}`);
          if (data?.date_window?.main_day !== today) throw new Error(`Wrong main day: ${data?.date_window?.main_day} expected ${today}`);
          if (matches.length < 10) throw new Error(`Too few scheduled matches: ${matches.length}`);
          if (tomorrowCount < 1) throw new Error(`Tomorrow window missing: ${tomorrow}`);
          console.log(`Bulletin OK: scheduled=${matches.length}, today=${todayCount}, tomorrow=${tomorrowCount}, live=${Number(data.live_count || 0)}`);
          NODE

      - name: Verify no unrelated repository file changed
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git status --porcelain | awk '{print $2}')"
          echo "$CHANGED"
          BAD="$(echo "$CHANGED" | grep -v '^data/full-bulletin.json$' || true)"
          if [ -n "$BAD" ]; then
            echo "Unexpected changed files detected:"
            echo "$BAD"
            exit 1
          fi

      - name: Commit only football bulletin
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/full-bulletin.json
          if git diff --cached --quiet; then
            echo "No bulletin change"
            exit 0
          fi
          git commit -m "Refresh football bulletin only"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Football bulletin push failed"
          exit 1
