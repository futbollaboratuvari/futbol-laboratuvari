name: Prematch Regression CI

on:
  push:
    branches:
      - feat/pro-prematch-final-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout focused PRO surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            pro-coupon-eligibility.js
            analysis-insights-v1.js
            package.json
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check scripts/pre-match-final-check.js
          node --check scripts/band-lite.js
          node --check pro-coupon-eligibility.js
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('package.json OK')"

      - name: Pre-match final check
        run: node tests/pre-match-final-check.test.js

      - name: Value and goal regressions
        run: |
          node tests/pro-coupon-eligibility.test.js
          node tests/pro-goal-market-bridge.test.js
          node tests/market-specialist-gates.test.js
          node tests/official-btts-pro.test.js

      - name: Team intelligence regressions
        run: |
          node tests/team-intelligence.test.js
          node tests/matchup-intelligence.test.js
          node tests/source-consensus.test.js
          node tests/source-consensus-band.test.js
