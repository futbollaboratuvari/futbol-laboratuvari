name: PRO Market Specialist CI

on:
  push:
    branches:
      - feat/pro-market-specialists
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout focused test surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            package.json
            pro-coupon-eligibility.js
          sparse-checkout-cone-mode: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax checks
        run: |
          node --check scripts/market-specialist-gates.js
          node --check scripts/pro-market-specialist-postprocess.js
          node --check scripts/run-pro-goal-market-specialist.js
          node --check scripts/apply-learning-weights.js
      - name: Market specialist tests
        run: node tests/market-specialist-gates.test.js
      - name: Existing learning tests
        run: |
          node tests/learning-confidence.test.js
          node tests/loss-pattern-memory.test.js
      - name: Existing PRO scoring tests
        run: node tests/robot-pro-v2.test.js
      - name: Existing goal bridge tests
        run: node tests/pro-goal-market-bridge.test.js
      - name: Existing HTFT tests
        run: node tests/high-odds-htft.test.js
      - name: Existing compact index tests
        run: node tests/pro-analysis-index.test.js
