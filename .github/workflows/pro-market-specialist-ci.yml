name: PRO Market Specialist CI

on:
  pull_request:
    paths:
      - 'scripts/market-specialist-gates.js'
      - 'scripts/pro-market-specialist-postprocess.js'
      - 'scripts/pro-goal-market-bridge.js'
      - 'scripts/iddaa-data-source.js'
      - 'scripts/robot-exact-scoring.js'
      - 'scripts/build-pro-analysis-index.js'
      - 'scripts/official-pro-analysis.js'
      - 'scripts/enrich-robot-official-markets.js'
      - 'analysis-insights-v1.js'
      - 'premium-analysis-v3.js'
      - 'scripts/export-high-value-json.js'
      - 'supabase/functions/fl-pro-analysis/index.ts'
      - 'tests/transparency-export.test.js'
      - 'tests/pro-analysis-supabase-sync.test.js'
      - 'tests/security-legal.test.js'
      - 'package.json'
      - 'scripts/generate-high-odds-htft.js'
      - 'tests/market-specialist-gates.test.js'
      - 'tests/pro-goal-market-bridge.test.js'
      - 'tests/iddaa-data-source.test.js'
      - 'tests/official-market-enrichment.test.js'
      - 'tests/transparency-market-options.test.js'
      - 'tests/pro-analysis-index.test.js'
      - 'tests/pro-index-from-github.test.js'
      - 'tests/high-odds-htft.test.js'
      - 'pro-coupon-eligibility.js'
      - '.github/workflows/pro-market-specialist-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pro-market-specialist-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  specialist-regression:
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check scripts/market-specialist-gates.js
          node --check scripts/pro-market-specialist-postprocess.js
          node --check scripts/iddaa-data-source.js
          node --check scripts/robot-exact-scoring.js
          node --check scripts/build-pro-analysis-index.js
          node --check scripts/official-pro-analysis.js
          node --check scripts/enrich-robot-official-markets.js
          node --check analysis-insights-v1.js
          node --check premium-analysis-v3.js
          node --check scripts/export-high-value-json.js

      - name: Specialist unit and regression tests
        run: |
          node tests/market-specialist-gates.test.js
          node tests/pro-goal-market-bridge.test.js
          node tests/iddaa-data-source.test.js
          node tests/official-market-enrichment.test.js
          node tests/transparency-market-options.test.js
          node tests/transparency-export.test.js
          node tests/pro-analysis-supabase-sync.test.js
          node tests/security-legal.test.js
          node tests/pro-analysis-index.test.js
          node tests/pro-index-from-github.test.js
          node tests/high-odds-htft.test.js
          node tests/pro-coupon-eligibility.test.js
          node tests/pre-match-final-check.test.js
          node tests/official-btts-pro.test.js
