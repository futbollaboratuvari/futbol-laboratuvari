name: Stats Memory

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/fixtures.json"
      - "scripts/stats-memory-lite.js"
      - "scripts/team-style-note.js"
      - "ops/main-run.txt"

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  stats-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Repair input conflicts
        run: node scripts/repair-conflict-markers.js

      - name: Update stats memory
        run: node scripts/stats-memory-lite.js

      - name: Link team style memory
        run: node scripts/team-style-note.js

      - name: Commit memory data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robot_match_archive.json data/ham_mac_havuzu.json || true
          if git diff --cached --quiet; then
            echo "No memory changes"
            exit 0
          fi
          git commit -m "Update stats memory"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && node scripts/validate-json-no-conflicts.js && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Stats Memory push failed after retries"
          exit 1
