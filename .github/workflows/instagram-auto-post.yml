name: Instagram Auto Post

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Instagram'a paylaşmadan sadece test et"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  instagram-auto-post:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
      META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION || 'v23.0' }}
      INSTAGRAM_DAILY_LIMIT: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Instagram robot manually
        id: instagram_robot
        shell: bash
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IG_SAFE_DEBUG: "true"
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'true' }}"
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/instagram_publish.py --dry-run
          else
            python scripts/instagram_publish.py
          fi

      - name: Commit Instagram log changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/instagram_posts.json || true
          if git diff --cached --quiet; then
            echo "Log değişikliği yok."
            exit 0
          fi
          git commit -m "Instagram robot log güncellendi"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Instagram log push başarısız."
          exit 1
