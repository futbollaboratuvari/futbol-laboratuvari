name: Specialist V2 Unit CI

on:
  push:
    branches:
      - feat/pro-specialist-v2
    paths:
      - .github/workflows/specialist-v2-unit-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout focused specialist surface
        uses: actions/checkout@v4
        with:
          ref: feat/pro-specialist-v2
          sparse-checkout: |
            scripts
            tests
            pro-coupon-eligibility.js
            analysis-insights-v1.js
            high-odds-htft-widget.js
            cache-version.js
            package.json
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check scripts/market-specialist-gates.js
          node --check scripts/pro-market-specialist-postprocess.js
          node --check scripts/pro-goal-market-bridge.js
          node --check scripts/generate-high-odds-htft.js

      - name: Specialist V2 regression
        run: |
          node tests/market-specialist-gates.test.js
          node tests/pro-goal-market-bridge.test.js
          node tests/high-odds-htft.test.js
          node tests/pro-coupon-eligibility.test.js
          node tests/pre-match-final-check.test.js
