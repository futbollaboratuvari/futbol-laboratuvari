name: Nesine Stats API Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/nesine-api-probe-trigger.txt"
      - "scripts/probe_nesine_stats_api.py"
      - ".github/workflows/nesine-api-probe.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install chromium
      - name: Capture Nesine stats API calls
        run: python scripts/probe_nesine_stats_api.py
      - name: Commit probe output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nesine-api-probe.json
          git diff --cached --quiet && exit 0
          git commit -m "Capture Nesine stats API calls"
          git pull --rebase origin main
          git push origin HEAD:main
