name: Value Goal Regression CI

on:
  push:
    branches:
      - fix/value-goal-edge-consistency
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout focused PRO surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            tests
            analysis-insights-v1.js
            pro-coupon-eligibility.js
            package.json
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: node --check pro-coupon-eligibility.js

      - name: Value gate
        run: node tests/pro-coupon-eligibility.test.js

      - name: Goal bridge
        run: node tests/pro-goal-market-bridge.test.js

      - name: Market regressions
        run: |
          node tests/market-specialist-gates.test.js
          node tests/official-btts-pro.test.js
