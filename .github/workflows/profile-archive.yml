name: Update profile archive

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/profile-run.txt"

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  update-profile-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update profile archive
        run: node scripts/profile-lite.js

      - name: Build source reading plan
        run: node scripts/source-plan-lite.js

      - name: Refresh public squad intelligence
        run: node scripts/team-news-auto.js

      - name: Build team status signals
        run: node scripts/team-status-lite.js

      - name: Build lineup signals
        run: node scripts/lineup-lite.js

      - name: Build home away performance
        run: node scripts/home-away-lite.js

      - name: Build standings signals
        run: node scripts/standings-lite.js

      - name: Validate team intelligence
        run: node tests/team-intelligence.test.js

      - name: Commit profile archive outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/longterm-match-archive.json data/team-profile-index.json data/league-profile-index.json data/profile-index.json data/source-reading-plan.json data/team-status-auto.json data/team-status-signals.json data/lineup-signals.json data/home-away-performance.json data/standings-signals.json data/archive/*-profiles.json data/archive/*-source-plan.json data/archive/*-team-status-auto.json data/archive/*-team-status.json data/archive/*-lineups.json data/archive/*-home-away.json data/archive/*-standings.json
          if git diff --cached --quiet; then
            echo "No profile archive changes"
            exit 0
          fi
          git commit -m "Update profile archive"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Profile archive push failed after retries"
          exit 1
