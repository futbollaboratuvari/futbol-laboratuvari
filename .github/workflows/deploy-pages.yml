name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - High Odds HTFT Daily Scan
      - Update fixtures and High Value Engine
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify Pages custom domain configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_json="$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          cname="$(printf '%s' "$pages_json" | jq -r '.cname // ""')"
          build_type="$(printf '%s' "$pages_json" | jq -r '.build_type // ""')"
          html_url="$(printf '%s' "$pages_json" | jq -r '.html_url // ""')"
          echo "Pages cname=$cname build_type=$build_type html_url=$html_url"
          test "$cname" = "futbollaboratuuvari.org"
          test "$build_type" = "workflow"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build safe public artifact
        run: npm run build

      - name: Stamp deployment version
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > public/deploy-version.txt
          grep -q 'id="live-power-center"' public/index.html

          live_power_version="$(sed -n 's/.*live-power-center-v1\.js?v=\([^"]*\).*/\1/p' public/index.html | head -1)"
          cache_version="$(sed -n 's/.*cache-version\.js?v=\([^"]*\).*/\1/p' public/index.html | head -1)"

          test -n "${live_power_version}"
          test -n "${cache_version}"
          grep -Fq "const version = \"${cache_version}\";" public/cache-version.js
          test -s public/data/coupon-assistant-pool.json
          node -e "const p=require('./public/data/coupon-assistant-pool.json'); if(!Array.isArray(p.items)||!Number.isFinite(Number(p.candidate_count))) throw new Error('coupon assistant pool invalid')"

          echo "EXPECTED_LIVE_POWER_VERSION=${live_power_version}" >> "${GITHUB_ENV}"
          echo "EXPECTED_CACHE_VERSION=${cache_version}" >> "${GITHUB_ENV}"
          echo "Artifact versions: live_power=${live_power_version} cache=${cache_version}"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live custom domain in real browser
        env:
          LIVE_URL: https://futbollaboratuuvari.org
        run: |
          set -euo pipefail
          html_ok=0
          for attempt in $(seq 1 18); do
            probe="${LIVE_URL}/?deploy=${GITHUB_SHA}&attempt=${attempt}"
            marker="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${LIVE_URL}/deploy-version.txt?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            html="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${probe}" || true)"
            if [ "${marker}" = "${GITHUB_SHA}" ] \
              && grep -q 'id="live-power-center"' <<<"${html}" \
              && grep -Fq "live-power-center-v1.js?v=${EXPECTED_LIVE_POWER_VERSION}" <<<"${html}" \
              && grep -Fq "cache-version.js?v=${EXPECTED_CACHE_VERSION}" <<<"${html}"; then
              html_ok=1
              break
            fi
            sleep 5
          done
          test "${html_ok}" = "1"

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "${chrome}"
          realtime_ok=0
          for browser_attempt in 1 2 3; do
            dom="/tmp/live-power-dom-${browser_attempt}.html"
            chrome_log="/tmp/live-power-chrome-${browser_attempt}.log"
            chrome_exit=0
            timeout 45s "${chrome}" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=25000 \
              --enable-logging=stderr \
              --dump-dom \
              "${LIVE_URL}/?deploy=${GITHUB_SHA}&browser_attempt=${browser_attempt}&cache_bust=${RANDOM}#live-power-center" \
              > "${dom}" 2> "${chrome_log}" || chrome_exit=$?
            if [ "${chrome_exit}" = "124" ]; then
              echo "Chromium process timeout on attempt ${browser_attempt}; retrying with a fresh browser." | tee -a "${chrome_log}"
            fi

            echo "Live Power diagnostics attempt ${browser_attempt}:"
            grep -o 'Akış: [^<]*' "${dom}" | head -1 || true
            grep -o 'Robot hazır: [^<]*' "${dom}" | head -1 || true

            console_bad=0
            if grep -q 'Supabase Realtime fallback mode\|violates the following Content Security Policy' "${chrome_log}"; then
              console_bad=1
              echo "Realtime browser console failure on attempt ${browser_attempt}:"
              tail -80 "${chrome_log}"
            fi

            if [ "${console_bad}" = "0" ] \
              && grep -q 'id="live-power-center"' "${dom}" \
              && grep -q 'Team Power + Goal Power + Canlı Analiz Robotu' "${dom}" \
              && grep -q 'Canlı Maç Analiz Robotu\|Canlı Analiz Robotu bekliyor' "${dom}" \
              && grep -q 'Akış: Supabase Realtime' "${dom}" \
              && grep -q 'class="flp-status"' "${dom}" \
              && ! grep -q 'Team Power + Goal Power ve canlı tahmin verisi yükleniyor' "${dom}"; then
              cp "${dom}" /tmp/live-power-dom.html
              cp "${chrome_log}" /tmp/live-power-chrome.log
              realtime_ok=1
              echo "LIVE USER TEST PASS: Canlı Güç + Canlı Analiz Robotu Supabase Realtime ile custom domainde render edildi. attempt=${browser_attempt}"
              break
            fi

            echo "Realtime henüz doğrulanmadı; taze browser oturumuyla yeniden deneniyor. attempt=${browser_attempt}"
            sleep 3
          done

          if [ "${realtime_ok}" != "1" ]; then
            echo "Supabase Realtime üç bağımsız gerçek browser denemesinde doğrulanamadı."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("/tmp/live-power-dom.html").read_text(encoding="utf-8", errors="replace")
          match = re.search(r'<tbody([^>]*)id=["\']analysis-database-body["\']([^>]*)>(.*?)</tbody>', html, re.S | re.I)
          if not match:
              raise SystemExit("Maç Kayıtları tbody not found in live DOM")

          attrs = f"{match.group(1)} {match.group(2)}"
          body = match.group(3)
          if 'data-source="match-records-summary"' not in attrs and "data-source='match-records-summary'" not in attrs:
              raise SystemExit("Maç Kayıtları ayrı arşiv kaynağından gelmiyor")
          blocked_states = (
              "Canlı veri görünümü bekleniyor",
              "Maç kayıtları yükleniyor",
              "Maç kayıtları yenilenemedi",
          )
          for state in blocked_states:
              if state in body:
                  raise SystemExit(f"Maç Kayıtları live DOM stayed in blocked state: {state}")

          if "<tr" not in body.lower():
              raise SystemExit("Maç Kayıtları live DOM has no rows")

          if not re.search(r'class=["\'][^"\']*status\s+(?:won|lost|pending)[^"\']*["\']', body, re.I):
              raise SystemExit("Maç Kayıtları live DOM has no rendered result status rows")

          results = re.search(r'<tbody[^>]*id=["\']result-archive["\'][^>]*>(.*?)</tbody>', html, re.S | re.I)
          if not results:
              raise SystemExit("Sonuçlar tbody not found in live DOM")
          if re.search(r'class=["\'][^"\']*status\s+pending[^"\']*["\']', results.group(1), re.I):
              raise SystemExit("Sonuçlar alanına bekleyen tahmin sızdı")

          print("LIVE USER TEST PASS: Maç Kayıtları ayrı arşivden, Sonuçlar yalnız doğrulanmış kayıtlardan render edildi.")
          PY

          python3 - <<'PY'
          from pathlib import Path
          import datetime as dt
          import html as html_lib
          import json
          import re
          from zoneinfo import ZoneInfo

          dom = Path("/tmp/live-power-dom.html").read_text(encoding="utf-8", errors="replace")
          now = dt.datetime.now(ZoneInfo("Europe/Istanbul"))
          today = now.strftime("%Y-%m-%d")
          clock = now.strftime("%H:%M")

          def section_by_id(section_id):
              match = re.search(
                  rf'<section\b[^>]*\bid=["\']{re.escape(section_id)}["\'][^>]*>(.*?)</section>',
                  dom,
                  re.S | re.I,
              )
              if not match:
                  raise SystemExit(f"{section_id} live DOM section not found")
              return match.group(1)

          def text_of(fragment):
              return html_lib.unescape(re.sub(r"<[^>]+>", " ", fragment))

          def number(value):
              if isinstance(value, (int, float)):
                  return float(value)
              match = re.search(r"-?\d+(?:[\.,]\d+)?", str(value or ""))
              return float(match.group(0).replace(",", ".")) if match else 0.0

          def is_upcoming(item):
              date = str(item.get("date") or "")[:10]
              if not date:
                  return False
              if date > today:
                  return True
              if date < today:
                  return False
              raw_time = str(item.get("time") or item.get("start_time") or "")
              time_match = re.match(r"^\d{2}:\d{2}", raw_time)
              return not time_match or time_match.group(0) > clock

          coupon_html = section_by_id("nesine-kupon-asistani")
          coupon_text = text_of(coupon_html)
          if "Kupon Asistanı" not in coupon_text or "Manuel Kupon Hazırlama" not in coupon_text:
              raise SystemExit("Kupon Asistanı live DOM heading missing")
          if "Kupon verisi yüklenemedi:" in coupon_text:
              raise SystemExit("Kupon Asistanı live DOM data load failed")

          daily = json.loads(Path("public/data/daily-coupons.json").read_text(encoding="utf-8"))
          pool = json.loads(Path("public/data/coupon-assistant-pool.json").read_text(encoding="utf-8"))
          has_published_coupon = any(
              isinstance(coupon, dict)
              and isinstance(coupon.get("selected_matches"), list)
              and len(coupon["selected_matches"]) > 0
              for coupon in (daily.get("coupons") or {}).values()
          )

          manual_candidates = []
          pool_fresh = str(pool.get("date") or "")[:10] >= today
          if not has_published_coupon and pool_fresh:
              for item in pool.get("items") or []:
                  if not is_upcoming(item):
                      continue
                  source = str(item.get("source") or "")
                  match_name = str(item.get("match_name") or "").strip()
                  market = str(item.get("recommended_market") or "").strip()
                  odds = number(item.get("estimated_odds"))
                  model = number(item.get("model_score"))
                  completeness = number(item.get("data_completeness"))
                  if (
                      "iddaa" in source.lower()
                      and match_name
                      and market
                      and odds > 1
                      and model >= 54
                      and completeness >= 45
                  ):
                      manual_candidates.append(item)

          coupon_leg_count = len(re.findall(r'class=["\'][^"\']*\bnka-leg\b', coupon_html, re.I))
          if has_published_coupon and coupon_leg_count == 0:
              raise SystemExit("Kupon Asistanı published coupon exists but no live legs rendered")
          if manual_candidates and coupon_leg_count == 0:
              raise SystemExit(
                  f"Kupon Asistanı has {len(manual_candidates)} eligible PRO manual candidates but rendered zero legs"
              )
          if manual_candidates and "Manuel aday havuzu" not in coupon_text:
              raise SystemExit("Kupon Asistanı manual fallback rendered without manual-pool notice")

          htft_html = section_by_id("high-odds-htft")
          htft_text = text_of(htft_html)
          if "1/2" not in htft_text or "2/1" not in htft_text:
              raise SystemExit("HTFT live DOM heading/market scope missing")
          if "Günlük 1/2 – 2/1 taraması hazırlanıyor." in htft_text:
              raise SystemExit("HTFT live DOM stayed in data-load fallback state")

          htft_data = json.loads(Path("public/data/high-odds-htft.json").read_text(encoding="utf-8"))
          raw_picks = htft_data.get("picks") or []
          upcoming_picks = [pick for pick in raw_picks if is_upcoming(pick)][:3]
          started_picks = [pick for pick in raw_picks if not is_upcoming(pick)]

          for pick in upcoming_picks:
              name = str(pick.get("match_name") or "").strip()
              if name and name not in htft_text:
                  raise SystemExit(f"HTFT upcoming pick missing from live DOM: {name}")

          for pick in started_picks:
              name = str(pick.get("match_name") or "").strip()
              if name and name in htft_text:
                  raise SystemExit(f"HTFT already-started pick leaked into live DOM: {name}")

          rendered_htft_cards = htft_text.count("Ters Sonuç Adayı")
          if upcoming_picks and rendered_htft_cards < len(upcoming_picks):
              raise SystemExit(
                  f"HTFT expected {len(upcoming_picks)} upcoming cards but rendered {rendered_htft_cards}"
              )

          print(
              "LIVE USER TEST PASS: Kupon Asistanı ve İY/MS motoru custom domainde render edildi. "
              f"manual_candidates={len(manual_candidates)} coupon_legs={coupon_leg_count} "
              f"htft_upcoming={len(upcoming_picks)} htft_cards={rendered_htft_cards}"
          )
          PY
