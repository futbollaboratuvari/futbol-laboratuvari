name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - High Odds HTFT Daily Scan
      - Update fixtures and High Value Engine
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Verify Pages custom domain configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pages_json="$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          cname="$(printf '%s' "$pages_json" | jq -r '.cname // ""')"
          build_type="$(printf '%s' "$pages_json" | jq -r '.build_type // ""')"
          html_url="$(printf '%s' "$pages_json" | jq -r '.html_url // ""')"
          echo "Pages cname=$cname build_type=$build_type html_url=$html_url"
          test "$cname" = "futbollaboratuuvari.org"
          test "$build_type" = "workflow"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build safe public artifact
        run: npm run build

      - name: Stamp deployment version
        run: |
          printf '%s\n' "${GITHUB_SHA}" > public/deploy-version.txt
          grep -q 'id="live-power-center"' public/index.html
          grep -q 'live-power-center-v1.js?v=20260918-live-realtime-v3' public/index.html
          grep -q 'const version = "20260918-live-realtime-v3";' public/cache-version.js

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live custom domain in real browser
        env:
          LIVE_URL: https://futbollaboratuuvari.org
          EXPECTED_UI_VERSION: 20260918-live-realtime-v3
        run: |
          set -euo pipefail
          html_ok=0
          for attempt in $(seq 1 18); do
            probe="${LIVE_URL}/?deploy=${GITHUB_SHA}&attempt=${attempt}"
            marker="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${LIVE_URL}/deploy-version.txt?deploy=${GITHUB_SHA}&attempt=${attempt}" || true)"
            html="$(curl --fail --silent --show-error --location \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "${probe}" || true)"
            if [ "${marker}" = "${GITHUB_SHA}" ] \
              && grep -q 'id="live-power-center"' <<<"${html}" \
              && grep -q "live-power-center-v1.js?v=${EXPECTED_UI_VERSION}" <<<"${html}" \
              && grep -q "cache-version.js?v=${EXPECTED_UI_VERSION}" <<<"${html}"; then
              html_ok=1
              break
            fi
            sleep 5
          done
          test "${html_ok}" = "1"

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "${chrome}"
          realtime_ok=0
          for browser_attempt in 1 2 3; do
            dom="/tmp/live-power-dom-${browser_attempt}.html"
            chrome_log="/tmp/live-power-chrome-${browser_attempt}.log"
            "${chrome}" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=25000 \
              --enable-logging=stderr \
              --dump-dom \
              "${LIVE_URL}/?deploy=${GITHUB_SHA}&browser_attempt=${browser_attempt}&cache_bust=${RANDOM}#live-power-center" \
              > "${dom}" 2> "${chrome_log}" || true

            echo "Live Power diagnostics attempt ${browser_attempt}:"
            grep -o 'Akış: [^<]*' "${dom}" | head -1 || true
            grep -o 'Robot hazır: [^<]*' "${dom}" | head -1 || true

            console_bad=0
            if grep -q 'Supabase Realtime fallback mode\|violates the following Content Security Policy' "${chrome_log}"; then
              console_bad=1
              echo "Realtime browser console failure on attempt ${browser_attempt}:"
              tail -80 "${chrome_log}"
            fi

            if [ "${console_bad}" = "0" ] \
              && grep -q 'id="live-power-center"' "${dom}" \
              && grep -q 'Team Power + Goal Power + Canlı Analiz Robotu' "${dom}" \
              && grep -q 'Canlı Maç Analiz Robotu\|Canlı Analiz Robotu bekliyor' "${dom}" \
              && grep -q 'Akış: Supabase Realtime' "${dom}" \
              && grep -q 'class="flp-status"' "${dom}" \
              && ! grep -q 'Team Power + Goal Power ve canlı tahmin verisi yükleniyor' "${dom}"; then
              cp "${dom}" /tmp/live-power-dom.html
              cp "${chrome_log}" /tmp/live-power-chrome.log
              realtime_ok=1
              echo "LIVE USER TEST PASS: Canlı Güç + Canlı Analiz Robotu Supabase Realtime ile custom domainde render edildi. attempt=${browser_attempt}"
              break
            fi

            echo "Realtime henüz doğrulanmadı; taze browser oturumuyla yeniden deneniyor. attempt=${browser_attempt}"
            sleep 3
          done

          if [ "${realtime_ok}" != "1" ]; then
            echo "Supabase Realtime üç bağımsız gerçek browser denemesinde doğrulanamadı."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("/tmp/live-power-dom.html").read_text(encoding="utf-8", errors="replace")
          match = re.search(r'<tbody([^>]*)id=["\']analysis-database-body["\']([^>]*)>(.*?)</tbody>', html, re.S | re.I)
          if not match:
              raise SystemExit("Maç Kayıtları tbody not found in live DOM")

          attrs = f"{match.group(1)} {match.group(2)}"
          body = match.group(3)
          if 'data-source="match-records-summary"' not in attrs and "data-source='match-records-summary'" not in attrs:
              raise SystemExit("Maç Kayıtları ayrı arşiv kaynağından gelmiyor")
          blocked_states = (
              "Canlı veri görünümü bekleniyor",
              "Maç kayıtları yükleniyor",
              "Maç kayıtları yenilenemedi",
          )
          for state in blocked_states:
              if state in body:
                  raise SystemExit(f"Maç Kayıtları live DOM stayed in blocked state: {state}")

          if "<tr" not in body.lower():
              raise SystemExit("Maç Kayıtları live DOM has no rows")

          if not re.search(r'class=["\'][^"\']*status\s+(?:won|lost|pending)[^"\']*["\']', body, re.I):
              raise SystemExit("Maç Kayıtları live DOM has no rendered result status rows")

          results = re.search(r'<tbody[^>]*id=["\']result-archive["\'][^>]*>(.*?)</tbody>', html, re.S | re.I)
          if not results:
              raise SystemExit("Sonuçlar tbody not found in live DOM")
          if re.search(r'class=["\'][^"\']*status\s+pending[^"\']*["\']', results.group(1), re.I):
              raise SystemExit("Sonuçlar alanına bekleyen tahmin sızdı")

          print("LIVE USER TEST PASS: Maç Kayıtları ayrı arşivden, Sonuçlar yalnız doğrulanmış kayıtlardan render edildi.")
          PY
