name: PRO Value Quality CI

on:
  push:
    branches:
      - feat/pro-value-quality-gate-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout focused PRO surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            api
            scripts
            tests
            analysis-insights-v1.js
            pro-coupon-eligibility.js
            package.json
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check pro-coupon-eligibility.js
          node --check tests/pro-coupon-eligibility.test.js

      - name: Smart value gate tests
        run: node tests/pro-coupon-eligibility.test.js

      - name: PRO market regressions
        run: |
          node tests/market-specialist-gates.test.js
          node tests/official-btts-pro.test.js
          node tests/pro-analysis-index.test.js
