name: Relaxed analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/relaxed-analysis.txt"

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  relaxed-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/robot-threshold-patch.js
      - run: node scripts/update-analysis-report.js
      - name: Finalize verified weekly Spor Toto
        run: |
          node scripts/sync-spor-toto-weekly-program.js || true
          node scripts/rebuild-spor-toto-bulletin.js
          node scripts/finalize-spor-toto-pro.js
          node tests/spor-toto-weekly.test.js
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update relaxed robot analysis outputs"
          file_pattern: data/*.json outputs/*.md
