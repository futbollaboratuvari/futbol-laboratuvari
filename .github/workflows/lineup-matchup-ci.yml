name: Lineup Matchup CI

on:
  push:
    branches:
      - feat/lineup-matchup-intelligence
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check scripts/matchup-intelligence.js
          node --check scripts/lineup-lite.js
          node --check scripts/band-lite.js
          node --check scripts/team-status-apply.js
          node --check scripts/export-high-value-json.js
          node --check scripts/build-pro-analysis-index.js
          node --check scripts/official-pro-analysis.js
      - name: Team intelligence tests
        run: npm run test:team-intelligence
      - name: Compact PRO index tests
        run: node tests/pro-analysis-index.test.js
      - name: Official PRO continuity tests
        run: node tests/official-btts-pro.test.js
