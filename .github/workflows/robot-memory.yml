name: Robot Hafiza Motoru

on:
  workflow_dispatch:
  schedule:
    - cron: "33 3 * * *"

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  robot-memory:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Robot hafizasini guncelle
        run: python tools/robot_memory_engine.py

      - name: Degisiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/robot_hafiza.json outputs/robot_hafiza_raporu.md
          if git diff --cached --quiet; then
            echo "No robot memory changes"
            exit 0
          fi
          git commit -m "Robot hafızası otomatik güncellendi"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Robot memory push failed after retries"
          exit 1
