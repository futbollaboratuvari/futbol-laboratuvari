name: Harden writer checkouts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/harden-writer-checkouts.yml"

permissions:
  contents: write

concurrency:
  group: futbol-writer-checkout-hardener
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure every serialized writer starts from latest main
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.github/workflows')
          changed = []

          for path in sorted(root.glob('*.y*ml')):
              if path.name == 'harden-writer-checkouts.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              if 'group: futbol-main-data-writer' not in text or 'contents: write' not in text:
                  continue
              lines = text.splitlines()
              out = []
              i = 0
              touched = False
              while i < len(lines):
                  line = lines[i]
                  out.append(line)
                  if line.strip() == 'uses: actions/checkout@v4':
                      indent = line[:len(line) - len(line.lstrip())]
                      next_i = i + 1
                      if next_i < len(lines) and lines[next_i].strip() == 'with:' and lines[next_i].startswith(indent):
                          out.append(lines[next_i])
                          i = next_i
                          child_indent = indent + '  '
                          scan = i + 1
                          has_ref = False
                          while scan < len(lines):
                              candidate = lines[scan]
                              if candidate.strip() and len(candidate) - len(candidate.lstrip()) <= len(indent):
                                  break
                              if candidate.strip().startswith('ref:'):
                                  has_ref = True
                              scan += 1
                          if not has_ref:
                              out.append(child_indent + 'ref: main')
                              touched = True
                      else:
                          out.append(indent + 'with:')
                          out.append(indent + '  ref: main')
                          touched = True
                  i += 1

              new_text = '\n'.join(out) + ('\n' if text.endswith('\n') else '')
              if touched and new_text != text:
                  path.write_text(new_text, encoding='utf-8')
                  changed.append(str(path))

          print('Updated writer workflows:', len(changed))
          for item in changed:
              print(' -', item)
          PY

      - name: Validate serialized writer checkouts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          failures = []
          checked = 0
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              if path.name == 'harden-writer-checkouts.yml':
                  continue
              text = path.read_text(encoding='utf-8')
              if 'group: futbol-main-data-writer' not in text or 'contents: write' not in text:
                  continue
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if line.strip() != 'uses: actions/checkout@v4':
                      continue
                  checked += 1
                  indent = len(line) - len(line.lstrip())
                  window = []
                  for candidate in lines[i+1:]:
                      if candidate.strip() and len(candidate) - len(candidate.lstrip()) <= indent:
                          break
                      window.append(candidate.strip())
                  if 'ref: main' not in window:
                      failures.append(f'{path}:{i+1}')

          print('Validated checkout steps:', checked)
          if failures:
              raise SystemExit('Missing ref: main -> ' + ', '.join(failures))
          PY

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          if git diff --cached --quiet; then
            echo "No writer checkout changes required"
            exit 0
          fi
          git commit -m "Ensure main data writers checkout latest main"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Writer checkout hardening push failed after retries"
          exit 1
