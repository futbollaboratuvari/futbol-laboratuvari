name: Update league structure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ops/league-structure-run.txt"

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  update-league-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build league structure signals
        run: node scripts/league-structure-lite.js

      - name: Commit league structure outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/league-structure-signals.json data/archive/*-league-structure.json
          if git diff --cached --quiet; then
            echo "No league structure changes"
            exit 0
          fi
          git commit -m "Update league structure signals"
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "League structure push failed after retries"
          exit 1
