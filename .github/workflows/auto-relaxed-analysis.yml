name: Auto relaxed analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "scripts/**"
      - ".github/workflows/auto-relaxed-analysis.yml"
  schedule:
    - cron: "13,43 * * * *"

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  auto-relaxed-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm run update:fixtures
          npm run update:analysis
          npm run export:live
          npm run build:live
          npm run sync:results
          npm run check:learning

      - name: Finalize verified weekly Spor Toto before commit
        run: |
          node scripts/sync-spor-toto-weekly-program.js || true
          node scripts/rebuild-spor-toto-bulletin.js
          node scripts/apply-spor-toto-weekly-market.js
          node scripts/finalize-spor-toto-pro.js
          node tests/spor-toto-market.test.js
          node tests/spor-toto-weekly.test.js

      - name: Guard against sudden data collapse
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const readCurrent = (file) => JSON.parse(fs.readFileSync(file, 'utf8'));
          const readPrevious = (file) => JSON.parse(execFileSync(
            'git', ['show', `HEAD:${file}`],
            { encoding: 'utf8', maxBuffer: 256 * 1024 * 1024 }
          ));

          const currentFixtures = readCurrent('data/fixtures.json');
          const previousFixtures = readPrevious('data/fixtures.json');
          const currentArchive = readCurrent('data/robot_match_archive.json');
          const previousArchive = readPrevious('data/robot_match_archive.json');

          const currentFixtureCount = Array.isArray(currentFixtures) ? currentFixtures.length : 0;
          const previousFixtureCount = Array.isArray(previousFixtures) ? previousFixtures.length : 0;
          const currentArchiveCount = Array.isArray(currentArchive.matches) ? currentArchive.matches.length : 0;
          const previousArchiveCount = Array.isArray(previousArchive.matches) ? previousArchive.matches.length : 0;

          const fixtureFloor = previousFixtureCount >= 50
            ? Math.max(10, Math.floor(previousFixtureCount * 0.10))
            : 0;
          const archiveFloor = previousArchiveCount >= 1000
            ? Math.floor(previousArchiveCount * 0.50)
            : 0;

          console.log(`Data guard fixtures: ${previousFixtureCount} -> ${currentFixtureCount}`);
          console.log(`Data guard archive: ${previousArchiveCount} -> ${currentArchiveCount}`);

          if (fixtureFloor && currentFixtureCount < fixtureFloor) {
            console.error(`Guard blocked commit: fixtures collapsed below ${fixtureFloor}.`);
            process.exit(1);
          }
          if (archiveFloor && currentArchiveCount < archiveFloor) {
            console.error(`Guard blocked commit: archive collapsed below ${archiveFloor}.`);
            process.exit(1);
          }
          NODE

      - name: Commit auto analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json outputs/*.md
          if git diff --cached --quiet; then
            echo "No auto analysis changes"
            exit 0
          fi
          git commit -m "Auto live data and robot analysis update"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && node scripts/validate-json-no-conflicts.js && node tests/spor-toto-market.test.js && node tests/spor-toto-weekly.test.js && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo "Auto analysis push failed after retries"
          exit 1
