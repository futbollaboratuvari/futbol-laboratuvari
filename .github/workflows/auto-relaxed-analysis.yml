name: Auto relaxed analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "scripts/**"
      - ".github/workflows/auto-relaxed-analysis.yml"
  schedule:
    - cron: "10,40 * * * *"

permissions:
  contents: write

concurrency:
  group: futbol-main-data-writer
  cancel-in-progress: false

jobs:
  auto-relaxed-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm run update:fixtures
          npm run update:analysis
          npm run export:live
          npm run build:live
          npm run sync:results
          npm run check:learning
      - name: Commit auto analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json outputs/*.md
          if git diff --cached --quiet; then
            echo "No auto analysis changes"
            exit 0
          fi
          git commit -m "Auto live data and robot analysis update"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Auto analysis push failed after retries"
          exit 1
