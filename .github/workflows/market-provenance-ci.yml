name: Market Provenance CI

on:
  push:
    branches:
      - fix/verified-market-provenance
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout focused surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            api
            scripts
            tests
            package.json
            pro-coupon-eligibility.js
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check scripts/raw-block-lite.js
          node --check scripts/market-provenance-guard.js
          node --check tests/market-provenance.test.js

      - name: Market provenance tests
        run: node tests/market-provenance.test.js

      - name: PRO regression tests
        run: |
          node tests/iddaa-data-source.test.js
          node tests/market-specialist-gates.test.js
          node tests/export-high-value-json.test.js
          node tests/pro-coupon-eligibility.test.js
          node tests/official-btts-pro.test.js
