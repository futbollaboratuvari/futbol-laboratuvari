name: PRO Live Backend Sync CI

on:
  push:
    branches:
      - fix/pro-live-backend-sync
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        node: [20, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout focused surface
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            api
            server-lib
            scripts
            tests
            package.json
            pro-coupon-eligibility.js
            vercel.json
            .gitignore
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax
        run: |
          node --check api/pro-analysis.js
          node --check server-lib/pro-index-from-github.js
          node --check scripts/vercel-ignore-build.js

      - name: New live source tests
        run: |
          node tests/pro-index-from-github.test.js
          node tests/vercel-backend-sync.test.js

      - name: Existing PRO regression tests
        run: |
          node tests/pro-analysis-index.test.js
          node tests/market-specialist-gates.test.js
          node tests/official-btts-pro.test.js
          node tests/pro-coupon-eligibility.test.js
