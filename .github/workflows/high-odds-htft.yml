name: High Odds HTFT Daily Scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/robot-analysis.json'
      - 'scripts/generate-high-odds-htft.js'
      - 'scripts/iddaa-data-source.js'
      - 'scripts/market-specialist-gates.js'
      - 'scripts/pro-market-specialist-postprocess.js'
      - 'scripts/robot-specialist-orchestrator.js'
      - 'scripts/robot-specialists/**'
      - 'tests/high-odds-htft.test.js'
      - 'nesine-coupon-assistant.js'
      - 'high-odds-htft-widget.js'
      - 'tests/kupon-assistant.test.js'
      - 'tests/market-specialist-gates.test.js'
      - 'tests/robot-specialist-orchestrator.test.js'
      - '.github/workflows/high-odds-htft.yml'
  schedule:
    - cron: '25 * * * *'

permissions:
  contents: write

concurrency:
  group: high-odds-htft
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test verified HTFT odds guard
        run: |
          node tests/high-odds-htft.test.js
          node tests/kupon-assistant.test.js
          node tests/market-specialist-gates.test.js

      - name: Generate high-odds HTFT cards
        run: node scripts/generate-high-odds-htft.js

      - name: Apply HTFT market specialist gate
        run: node scripts/pro-market-specialist-postprocess.js htft

      - name: Merge verified HTFT feed into specialist orchestrator
        run: |
          node tests/robot-specialist-orchestrator.test.js
          node scripts/robot-specialist-orchestrator.js
          node scripts/validate-pro-source-size.js

      - name: Validate output
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/high-odds-htft.json', 'utf8'));
          if (!Array.isArray(data.picks)) throw new Error('picks array missing');
          if (!Array.isArray(data.market_scope) || !data.market_scope.includes('1/2') || !data.market_scope.includes('2/1')) throw new Error('market scope invalid');
          if (data.picks.length > 3) throw new Error('more than 3 picks generated');
          if (Number(data.selected_count) !== data.picks.length) throw new Error('selected count mismatch');
          if (Number(data.identity_match_count) !== Number(data.matched_by_official_id_count) + Number(data.matched_by_date_teams_count) + Number(data.matched_by_date_time_similarity_count)) throw new Error('identity diagnostics mismatch');
          if (data.date < data.requested_date) throw new Error('stale bulletin date generated');
          if (Number(data.official_high_odds_match_count) >= 2 && Number(data.scheduled_scan_count) >= 2 && Number(data.identity_match_count) === 0) throw new Error('official HTFT matches exist but provider identities do not match');
          if (!/iddaa/i.test(String(data.odds_source || ''))) throw new Error('official odds source missing');
          if (data.odds_label !== 'Resmî İddaa İY/MS oranı') throw new Error('official odds label missing');
          if (data.market_specialist?.version !== 'market-specialist-gates-v4') throw new Error('HTFT specialist v4 gate missing');
          if ('specialist_candidate_pool' in data) throw new Error('temporary specialist candidate pool leaked into final output');
          if (!Array.isArray(data.rejected_picks)) throw new Error('specialist rejected diagnostics missing');
          if (Number(data.market_specialist?.htft_picks_checked || 0) < data.picks.length) throw new Error('specialist checked count invalid');
          if (Number(data.market_specialist?.htft_picks_rejected || 0) !== data.rejected_picks.length) throw new Error('specialist rejected count mismatch');
          if (data.status === 'ready' && data.picks.length < 2) throw new Error('ready status requires at least two specialist-qualified picks');
          if (data.picks.length < 2 && Number(data.candidate_count || 0) >= 2 && data.status !== 'insufficient_specialist_quality') throw new Error('specialist quality failure status missing');
          for (const pick of data.picks) {
            if (!['1/2', '2/1'].includes(pick.market)) throw new Error(`invalid market: ${pick.market}`);
            if (!pick.match_name || !pick.reason) throw new Error('incomplete pick');
            if (pick.odds_verified !== true) throw new Error('unverified HTFT odds rejected');
            if (!/iddaa/i.test(String(pick.odds_source || ''))) throw new Error('pick odds source missing');
            if (!/^\d{6,12}$/.test(String(pick.iddaa_event_id || ''))) throw new Error('resolved official event id missing');
            if (!['iddaa_event_id', 'event_id', 'shared_match_code', 'date_teams', 'date_teams_time', 'date_time_team_similarity'].includes(pick.identity_match_source)) throw new Error('identity match source missing');
            if (pick.date !== data.date) throw new Error('pick date does not match bulletin date');
            if (pick.identity_match_source === 'date_time_team_similarity' && Number(pick.identity_match_score) < 72) throw new Error('unsafe fuzzy identity match');
            const real = Number(pick.bookmaker_odds);
            if (!(real >= 11.75)) throw new Error('real high-odds threshold failed');
            if (Number(pick.real_odds) !== real) throw new Error('real_odds mismatch');
            if (Number(pick.model_odds) !== real) throw new Error('legacy display field must mirror official odd');
            if (!pick.market_specialist) throw new Error('pick specialist diagnostics missing');
            if (pick.specialist_eligible !== true) throw new Error('blocked specialist pick leaked into cards');
            if (pick.specialist_decision === 'block') throw new Error('blocked specialist decision leaked into cards');
            if (pick.first_half_signal_verified !== true) throw new Error('HTFT card lacks verified first-half direction');
            if (/derived/i.test(String(pick.first_half_signal_source || ''))) throw new Error('derived first-half direction leaked into HTFT card');
            if (!Number.isFinite(Number(pick.specialist_quality_score))) throw new Error('specialist quality score missing');
          }
          console.log(`Validated ${data.picks.length} verified official HTFT picks for ${data.date}.`);
          NODE

      - name: Commit generated HTFT feed and routed robot data
        if: github.ref == 'refs/heads/main'
        run: |
          cp data/high-odds-htft.json /tmp/high-odds-htft.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/high-odds-htft.json data/high-odds-htft.json

            # Always merge the verified HTFT feed into the newest main robot data.
            # This prevents a slower HTFT run from overwriting a fresher main-writer snapshot.
            node scripts/robot-specialist-orchestrator.js
            node scripts/validate-pro-source-size.js

            if git diff --quiet -- data/high-odds-htft.json data/robot-analysis.json; then
              echo 'No HTFT specialist feed change.'
              exit 0
            fi

            git add data/high-odds-htft.json data/robot-analysis.json
            git commit -m 'chore: refresh verified HTFT specialist feed'
            if git push origin HEAD:main; then
              exit 0
            fi

            echo 'Remote changed while publishing; retrying on latest main.'
            sleep 2
          done

          echo 'Unable to publish HTFT specialist feed after 3 attempts.' >&2
          exit 1
