<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Futbol Laboratuvarı — Canlı Mobil Test</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:560px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:12px;margin:5px 0 20px}.logo{width:48px;height:48px;border-radius:14px}.hero,.card{background:#141e30;border:1px solid #243149;border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(145deg,#18243a,#101827)}h1{font-size:25px;margin:4px 0 8px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6}.muted{opacity:.65;font-size:13px;line-height:1.5}.status{margin-top:10px;color:#9fd2ff;font-size:13px}.match{padding:14px 0;border-top:1px solid #27344b}.match:first-child{border-top:0}.league{font-size:11px;opacity:.55}.teams{font-weight:750;font-size:17px;margin:6px 0}.meta{display:flex;justify-content:space-between;font-size:12px;opacity:.65}.btn{display:block;text-align:center;text-decoration:none;color:#fff;background:#246bff;padding:12px;border-radius:12px;margin-top:14px;font-weight:700}.error{color:#ffb4b4}.count{float:right;background:#243149;padding:4px 8px;border-radius:8px;font-size:11px}</style></head>
<body><main><header class="top"><img class="logo" src="../assets/images/fl-logo-mark.webp" alt="Futbol Laboratuvarı"><div><strong>Futbol Laboratuvarı</strong><div class="eyebrow">Canlı mobil test</div></div></header><section class="hero"><div class="eyebrow">Gerçek proje verisine bağlantı testi</div><h1>Bugünün maçları</h1><p class="muted">Bu test ekranı mevcut ana site dosyalarını değiştirmez. Mobil arayüz, projede bulunan canlı veri JSON dosyalarını doğrudan okumayı dener.</p><div id="status" class="status">Veri okunuyor…</div></section><section class="card"><strong>Canlı Veri <span id="count" class="count">0</span></strong><div id="matches" style="margin-top:10px"><p class="muted">Yükleniyor…</p></div></section><a class="btn" href="./index.html">Demo ana ekranına dön</a></main><script>
const sources=['../data/live-now.json','../data/live-matches.json'];
const first=(o,keys,fallback='')=>{for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return fallback};
function listify(data){if(Array.isArray(data))return data;for(const k of ['matches','fixtures','games','data','items','results','events'])if(Array.isArray(data?.[k]))return data[k];return data&&typeof data==='object'?[data]:[]}
function render(rows,source){const box=document.getElementById('matches');document.getElementById('count').textContent=rows.length; if(!rows.length){box.innerHTML='<p class="muted">Kaynak bulundu fakat gösterilebilir maç kaydı yok.</p>';return} box.innerHTML=rows.slice(0,20).map(m=>{const home=first(m,['homeTeam','home','home_name','homeTeamName'],first(m.home,['name','teamName'],'Ev sahibi'));const away=first(m,['awayTeam','away','away_name','awayTeamName'],first(m.away,['name','teamName'],'Deplasman'));const league=first(m,['league','leagueName','competition','tournament'],'Lig bilgisi yok');const time=first(m,['time','matchTime','date','startTime'],'Saat bilgisi yok');const score=first(m,['score','status','state'],'');return `<article class="match"><div class="league">${String(league)}</div><div class="teams">${String(home)} <span style="opacity:.45">vs</span> ${String(away)}</div><div class="meta"><span>${String(time)}</span><span>${String(score)}</span></div></article>`}).join('');document.getElementById('status').textContent='Veri kaynağı okundu: '+source}
async function load(){let lastErr='';for(const url of sources){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const data=await r.json();const rows=listify(data);if(rows.length){render(rows,url.replace('../',''));return}lastErr=url+' boş'}catch(e){lastErr=url+' okunamadı'}}document.getElementById('status').innerHTML='<span class="error">Test verisi okunamadı. '+lastErr+'</span>';document.getElementById('matches').innerHTML='<p class="muted">Bu, uygulama mimarisinin bozuk olduğu anlamına gelmez; veri dosyasının yapısını bir sonraki aşamada mevcut site koduyla birebir eşleştireceğiz.</p>'}load();
</script></body></html>
